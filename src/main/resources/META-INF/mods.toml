# See https://docs.minecraftforge.net/en/1.21.x/gettingstarted/modfiles/#modstoml
# There are lots of things you can do with the mods.toml, and not all fields are included with this MDK
# References: https://github.com/MinecraftForge/MDKExamples

modLoader="javafml"
loaderVersion="[65,)"
license="MIT"
issueTrackerURL="https://github.com/xinthral/xincraft/issues"
#clientSideOnly=true #optional, default=false

[[mods]]
modId="xincraft"
version="${mod_version}"
displayName="Xincraft"
#updateJSONURL="https://example.com/updates.json" #optional
displayURL="https://github.com/xinthral/xincraft"
logoFile="xincraft.png"
#credits="" #optional
authors="Xinthral" #optional
#displayTest="MATCH_VERSION" #optional, default=MATCH_VERSION when not clientSideOnly, else IGNORE_ALL_VERSION

description='''Tin, bronze and a whole lot of rails: fast tin rails, quiet padded rails, bouncy, honey, inspector, ender and charging rails. Self-driving locomotives, jingle carts and motorboats with upgrades, turbines to power them, and exotic flowers that work like little beacons.'''

[[dependencies.xincraft]] #recommended
    modId="forge"
    mandatory=true
    versionRange="[65,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.xincraft]] #recommended
    modId="minecraft"
    mandatory=true
    versionRange="[26.2,26.3)"
    ordering="NONE"
    side="BOTH"
